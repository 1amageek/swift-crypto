name: Main

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8,20 * * *"

jobs:
  unit-tests:
    name: Unit tests
    uses: apple/swift-nio/.github/workflows/unit_tests.yml@199ccb983c1085583a11e7eb46f053ccdec64c52
    with:
      minimum_swift_version: "6.4"
      linux_6_0_enabled: false
      linux_6_1_enabled: false
      linux_6_2_enabled: false
      linux_6_3_enabled: false
      linux_nightly_next_enabled: true
      linux_nightly_next_arguments_override: "--configuration release --explicit-target-dependency-import-check error"
      linux_nightly_main_enabled: false
      windows_6_1_enabled: false
      windows_6_2_enabled: false
      windows_6_3_enabled: false
      windows_nightly_next_enabled: true
      windows_nightly_next_arguments_override: "--configuration release --explicit-target-dependency-import-check error"
      windows_nightly_main_enabled: false

  release-builds:
    name: Release builds
    uses: apple/swift-nio/.github/workflows/release_builds.yml@199ccb983c1085583a11e7eb46f053ccdec64c52
    with:
      minimum_swift_version: "6.4"
      linux_6_0_enabled: false
      linux_6_1_enabled: false
      linux_6_2_enabled: false
      linux_6_3_enabled: false
      linux_nightly_next_enabled: true
      linux_nightly_main_enabled: false
      windows_6_1_enabled: false
      windows_6_2_enabled: false
      windows_6_3_enabled: false
      windows_nightly_next_enabled: true
      windows_nightly_main_enabled: false

  cxx-interop:
    name: Cxx interop
    uses: apple/swift-nio/.github/workflows/cxx_interop.yml@199ccb983c1085583a11e7eb46f053ccdec64c52
    with:
      minimum_swift_version: "6.4"
      linux_6_0_enabled: false
      linux_6_1_enabled: false
      linux_6_2_enabled: false
      linux_6_3_enabled: false
      linux_nightly_next_enabled: true
      linux_nightly_main_enabled: false

  swift-6-4-platform-validation:
    name: Swift 6.4 platform validation
    uses: ./.github/workflows/platform_validation.yml
    with:
      extended: ${{ github.event_name == 'schedule' }}

name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.7
    with:
      license_header_check_project_name: "SwiftCrypto"
      docs_check_enabled: false

  unit-tests:
    name: Unit tests
    uses: apple/swift-nio/.github/workflows/unit_tests.yml@main
    with:
      minimum_swift_version: "6.4"
      linux_6_0_enabled: false
      linux_6_1_enabled: false
      linux_6_2_enabled: false
      linux_6_3_enabled: false
      linux_nightly_next_enabled: false
      linux_nightly_main_enabled: true
      linux_nightly_main_arguments_override: "--explicit-target-dependency-import-check error"
      windows_6_1_enabled: false
      windows_6_2_enabled: false
      windows_6_3_enabled: false
      windows_nightly_next_enabled: false
      windows_nightly_main_enabled: true
      windows_nightly_main_arguments_override: "--explicit-target-dependency-import-check error"

  release-builds:
    name: Release builds
    uses: apple/swift-nio/.github/workflows/release_builds.yml@main
    with:
      minimum_swift_version: "6.4"
      linux_6_0_enabled: false
      linux_6_1_enabled: false
      linux_6_2_enabled: false
      linux_6_3_enabled: false
      linux_nightly_next_enabled: false
      linux_nightly_main_enabled: true
      windows_6_1_enabled: false
      windows_6_2_enabled: false
      windows_6_3_enabled: false
      windows_nightly_next_enabled: false
      windows_nightly_main_enabled: true

  cxx-interop:
    name: Cxx interop
    uses: apple/swift-nio/.github/workflows/cxx_interop.yml@main
    with:
      minimum_swift_version: "6.4"
      linux_6_0_enabled: false
      linux_6_1_enabled: false
      linux_6_2_enabled: false
      linux_6_3_enabled: false
      linux_nightly_next_enabled: false
      linux_nightly_main_enabled: true

  platform-validation:
    name: Platform validation
    uses: ./.github/workflows/platform_validation.yml

  macos-tests:
    name: macOS tests
    uses: apple/swift-nio/.github/workflows/macos_tests.yml@main
    with:
      runner_pool: general
      build_scheme: swift-crypto-Package
      swift_6_1_enabled: false
      swift_6_2_enabled: false
      swift_6_3_enabled: false
      xcode_26_2_enabled: false
      xcode_latest_beta_enabled: true

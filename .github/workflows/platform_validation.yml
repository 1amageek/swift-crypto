name: Platform validation

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      extended:
        type: boolean
        description: Run scheduled static Linux validation.
        default: false

jobs:
  cmake:
    name: CMake with Swift 6.4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: swiftlang/swift:nightly-6.4.x-jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true
      - name: Install build dependencies
        run: apt-get update -q && apt-get install -y -q ca-certificates curl ninja-build
      - name: Build with CMake 3.29
        run: |
          set -euo pipefail
          swift --version \
            | grep -E '(^|[[:space:]])(Apple )?Swift version 6\.4([^0-9]|$)'
          curl -fsSL --retry 3 https://raw.githubusercontent.com/apple/swift-nio/199ccb983c1085583a11e7eb46f053ccdec64c52/scripts/cmake-build.sh \
            | CMAKE_VERSION=3.29.9 TARGET_DIRECTORY=. bash

  macos:
    name: macOS package validation with Swift 6.4
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true
      - name: Install Swift 6.4 toolchain
        run: |
          set -euo pipefail
          metadata="$(curl -fsSL --retry 3 https://www.swift.org/api/v1/install/dev/6.4.x/macos.json)"
          snapshot="$(jq -er '.universal[0].dir' <<< "$metadata")"
          download="$(jq -er '.universal[0].download' <<< "$metadata")"
          [[ "$snapshot" == swift-6.4.x-* ]]
          [[ "$download" == "${snapshot}-osx.pkg" ]]
          package="${RUNNER_TEMP}/${download}"
          curl -fsSL --retry 3 \
            "https://download.swift.org/swift-6.4.x-branch/xcode/${snapshot}/${download}" \
            -o "$package"
          pkgutil --check-signature "$package" \
            | grep -F 'Developer ID Installer: Swift Open Source (V9AUD2URP3)'
          installer -pkg "$package" -target CurrentUserHomeDirectory
          toolchain="${HOME}/Library/Developer/Toolchains/${snapshot}.xctoolchain"
          test -d "$toolchain"
          toolchain_identifier="$(plutil -extract CFBundleIdentifier raw "${toolchain}/Info.plist")"
          test -n "$toolchain_identifier"
          echo "TOOLCHAINS=${toolchain_identifier}" >> "$GITHUB_ENV"
      - name: Test the macOS package
        run: |
          set -euo pipefail
          xcrun swift --version \
            | grep -E '(^|[[:space:]])(Apple )?Swift version 6\.4([^0-9]|$)'
          /usr/bin/xcodebuild test \
            -scheme swift-crypto-Package \
            -destination 'platform=macOS' \
            -quiet
      - name: Run macOS capability validators
        run: |
          set -euo pipefail
          xcrun swift run crypto-digest-validation
          xcrun swift run crypto-capability-validation

  wasm:
    name: Standard and Embedded WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: swiftlang/swift:nightly-6.4.x-jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true
      - name: Install Swift 6.4 WebAssembly SDK
        run: |
          set -euo pipefail
          apt-get update -q
          apt-get install -y -q ca-certificates curl jq
          metadata="$(curl -fsSL --retry 3 https://www.swift.org/api/v1/install/dev/6.4.x/wasm-sdk.json)"
          snapshot="$(jq -er '.[0].dir' <<< "$metadata")"
          download="$(jq -er '.[0].download' <<< "$metadata")"
          checksum="$(jq -er '.[0].checksum' <<< "$metadata")"
          [[ "$snapshot" == swift-6.4.x-* ]]
          [[ "$download" == "${snapshot}_wasm.artifactbundle.tar.gz" ]]
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          sdk_url="https://download.swift.org/swift-6.4.x-branch/wasm-sdk/${snapshot}/${download}"
          swift sdk install --swift-sdks-path /tmp/swiftsdks "$sdk_url" --checksum "$checksum"
          swift --version \
            | grep -E '(^|[[:space:]])(Apple )?Swift version 6\.4([^0-9]|$)'
      - name: Run WebAssembly validators
        run: |
          set -euo pipefail
          standard_sdk="$(swift sdk list --swift-sdks-path /tmp/swiftsdks | grep '_wasm$' | head -n 1)"
          embedded_sdk="$(swift sdk list --swift-sdks-path /tmp/swiftsdks | grep '_wasm-embedded$' | head -n 1)"
          test -n "$standard_sdk"
          test -n "$embedded_sdk"
          swift run --swift-sdk "$standard_sdk" --swift-sdks-path /tmp/swiftsdks crypto-digest-validation
          swift run --swift-sdk "$standard_sdk" --swift-sdks-path /tmp/swiftsdks crypto-capability-validation
          swift run --swift-sdk "$embedded_sdk" --swift-sdks-path /tmp/swiftsdks crypto-digest-validation
          swift run --swift-sdk "$embedded_sdk" --swift-sdks-path /tmp/swiftsdks crypto-capability-validation

  static-linux:
    name: Static Linux
    if: inputs.extended
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: swiftlang/swift:nightly-6.4.x-jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true
      - name: Install Swift 6.4 static Linux SDK
        run: |
          set -euo pipefail
          apt-get update -q
          apt-get install -y -q ca-certificates curl jq
          metadata="$(curl -fsSL --retry 3 https://www.swift.org/api/v1/install/dev/6.4.x/static-sdk.json)"
          snapshot="$(jq -er '.[0].dir' <<< "$metadata")"
          download="$(jq -er '.[0].download' <<< "$metadata")"
          checksum="$(jq -er '.[0].checksum' <<< "$metadata")"
          [[ "$snapshot" == swift-6.4.x-* ]]
          [[ "$download" == "${snapshot}_static-linux-0.1.0.artifactbundle.tar.gz" ]]
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]
          sdk_url="https://download.swift.org/swift-6.4.x-branch/static-sdk/${snapshot}/${download}"
          swift sdk install --swift-sdks-path /tmp/swiftsdks "$sdk_url" --checksum "$checksum"
          swift --version \
            | grep -E '(^|[[:space:]])(Apple )?Swift version 6\.4([^0-9]|$)'
      - name: Run static Linux validator
        run: |
          set -euo pipefail
          sdk="$(swift sdk list --swift-sdks-path /tmp/swiftsdks | grep '_static-linux' | head -n 1)"
          test -n "$sdk"
          swift run --swift-sdk "$sdk" --swift-sdks-path /tmp/swiftsdks crypto-capability-validation
